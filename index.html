<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokedeX</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

    <div class="container">

        <img src="pokedex-logo.png" alt="Logo">
  
        <div class="demo-flex-spacer"></div>

        <div class="pokemonInfos" id="pokemonInfos" style="display: none;">
            <img src="" alt="Pokemon" id="pokemonImage">
            <h1 id="pokeName"></h1>
        </div>
      
        <div class="webflow-style-input">
          <input class="" type="text" id="pokemonName" placeholder="Search Pokemon"></input>
          <button id="submitPokemon"><ion-icon name="arrow-forward-outline"></ion-icon></button>
        </div>
      
        <div class="demo-flex-spacer"></div>
      
    </div>


<script src="js/script.js"></script>
</body>
</html>
